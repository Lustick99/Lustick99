function commune(){let qs=['Amoutivé','Nyékonakpoé','Kodjoviakopé','Hanoukopé','Adawlato','Assivito','Bè-Klikamé','Tokoin Gbadago','Sangaratimé','Octaviano Nétimé','Atikoumé','Bassadji','Adoboukomé','Doulassamé','Adjololo'];return `${pagehero('La Commune du Golfe 4','Un territoire d’histoire et de vie, des quartiers dynamiques et une vision de proximité au service de ses habitants.','La commune',true)}<section class="section"><div class="wrap cols-2 aligned"><div class="editorial"><div class="eyebrow">Notre territoire</div><h2 class="serif section-title">Amoutivé, au cœur du Grand Lomé.</h2><p>Située au sud-ouest du Togo et ouverte sur le littoral du Golfe de Guinée, la Commune du Golfe 4 fait partie des treize communes du District Autonome du Grand Lomé.</p><p>Riche de ses quartiers, de ses espaces de vie et de son dynamisme économique et culturel, elle œuvre à offrir un cadre de vie de qualité, propice à la cohésion sociale et à l’engagement citoyen.</p><div class="about-statrow"><div><strong>15 km²</strong><small>Superficie publiée sur l'ancien site</small></div><div><strong>Lomé</strong><small>District autonome du Grand Lomé</small></div></div></div><div class="cityvisual"><div class="territory-fallback"></div><img src="${SOURCE.carte}" onerror="this.style.display='none'" alt="Document cartographique historique de la Commune du Golfe 4"><div class="visualoverlay"></div><div class="citycaption">Une commune aux multiples visages</div></div></div></section><section class="section section-soft"><div class="wrap"><div class="sectionhead"><div><div class="eyebrow">Une ambition partagée</div><h2 class="serif section-title">Notre vision, nos valeurs.</h2><p class="intro">Une administration dynamique, rigoureuse, à l’écoute des citoyens et tournée vers le développement local.</p></div></div><div class="valuesgrid">${[{i:'heart',h:'Respect & solidarité',d:'Favoriser l’écoute, le dialogue et des services attentifs aux besoins de chacun.'},{i:'shield',h:'Transparence',d:'Placer l’intégrité et l’équité au cœur de l’action et des décisions municipales.'},{i:'users',h:'Participation citoyenne',d:'Renforcer la proximité et encourager la contribution des habitants.'},{i:'briefcase',h:'Collaboration',d:'Travailler avec les associations, entreprises et partenaires de la commune.'},{i:'leaf',h:'Développement durable',d:'Concilier les besoins d’aujourd’hui avec la préservation des ressources.'},{i:'landmark',h:'Service public',d:'Améliorer l’efficacité et la qualité de l’accueil et des prestations communales.'}].map(v=>`<div class="valuecard">${icon(v.i)}<h3>${v.h}</h3><p>${v.d}</p></div>`).join('')}</div></div></section><section class="section"><div class="wrap"><div class="eyebrow">Notre géographie</div><h2 class="serif section-title">Des quartiers, une même commune.</h2><p class="intro" style="margin-bottom:25px">Quelques-uns des quartiers cités dans la présentation historique de la commune.</p><div class="neighborhoods">${qs.map(x=>`<span>${x}</span>`).join('')}</div><div class="archivebar">${icon('info')} Liste indicative issue du site existant, à vérifier avant publication finale.</div><div class="v3-explore">${v3Grid([v3Card('Territoire & quartiers','Découvrir la composition de la commune.','commune/territoire','map'),v3Card('Vision & valeurs','Les principes qui guident les actions municipales.','commune/vision','leaf'),v3Card('À la découverte','Patrimoine, équipements et lieux à découvrir.','commune/decouvrir','globe')])}</div></div></section>`}
function municipalite(){return `${pagehero('La municipalité','Le Conseil municipal, le bureau exécutif, les commissions permanentes et les directions qui assurent le fonctionnement de la commune.','La municipalité')}<section class="section"><div class="wrap"><div class="mayorcard"><div class="mayorinfo"><div class="eyebrow">La mairie d'Amoutivé</div><h2>Jean-Pierre Fabre</h2><div class="ribbon">Maire de la Commune du Golfe 4</div><p>Les instances municipales accompagnent les politiques publiques locales et coordonnent les actions menées au service de la population.</p><a href="${SOURCE.conseil}" target="_blank" rel="noopener noreferrer" class="textlink">Consulter les informations historiques ${icon('up')}</a></div><div class="mayorportrait"><img src="${SOURCE.portrait}" onerror="this.style.display='none'" alt="Portrait historique de Jean-Pierre Fabre publié sur le site municipal"><div class="caption">Portrait d'archive publié sur le site officiel</div></div></div></div></section><section class="section section-soft"><div class="wrap"><div class="sectionhead"><div><div class="eyebrow">Gouvernance locale</div><h2 class="serif section-title">Une organisation au service de tous.</h2></div></div><div class="govcards">${[{n:'01',h:'Le Conseil municipal',d:'L’organe délibérant de la commune, chargé des grandes orientations et des décisions relevant de ses compétences.',link:'#/municipalite/conseil'},{n:'02',h:'Le Bureau exécutif',d:'La coordination des actions municipales et la mise en œuvre des décisions de la commune.',link:'#/municipalite/bureau'},{n:'03',h:'Le Secrétariat général',d:'Le suivi administratif, la coordination des services et l’appui au fonctionnement de la mairie.',link:'#/municipalite/secretariat'},{n:'04',h:'Les commissions',d:'Des espaces de travail et d’examen des dossiers relatifs aux différents domaines de l’action locale.',link:'#/municipalite/commissions'},{n:'05',h:'Les directions municipales',d:'Les directions techniques, financières, administratives et sociales au service des habitants.',link:'#/municipalite/directions'},{n:'06',h:'L’organigramme',d:'Comprendre l’organisation générale de la mairie et les liens entre les différents services.',link:'#/municipalite/organigramme'}].map(v=>`<div class="govern-card"><div class="num">${v.n}</div><h3>${v.h}</h3><p>${v.d}</p><a class="textlink" href="${v.link}">Découvrir cette rubrique ${icon('arrow')}</a></div>`).join('')}</div><div class="archivebar">${icon('info')} La composition nominative détaillée de la mandature actuelle doit être validée auprès de la mairie.</div></div></section>`}
function demarches(){return `${pagehero('Démarches & services','Accédez à un catalogue pratique des prestations proposées par la commune et trouvez les informations nécessaires pour préparer vos démarches.','Démarches & services',true)}<section class="section section-soft"><div class="wrap"><div class="directorytools"><label class="searchbox">${icon('search')}<input id="serviceSearch" type="search" placeholder="Rechercher une démarche, un document…" aria-label="Rechercher une démarche" autocomplete="off"></label><div class="chips" id="filters"><button class="chip active" data-cat="Tous">Tous</button><button class="chip" data-cat="État civil">État civil</button><button class="chip" data-cat="Relations citoyennes">Relations citoyennes</button><button class="chip" data-cat="Informations pratiques">Infos pratiques</button></div></div><p class="service-count" id="serviceCount"></p><div class="svcdir" id="servicelist">${services.map(cardService).join('')}</div></div></section><section class="section"><div class="wrap"><div class="cols-2 aligned"><div><div class="eyebrow">Guichet de proximité</div><h2 class="serif section-title">Bien préparer votre visite en mairie.</h2><p class="intro">Les informations relatives aux pièces justificatives, frais et délais varient selon la démarche. Contactez le service compétent pour confirmation avant de vous déplacer.</p>${btn('Contacter la mairie','#/contact')}</div><div class="callout"><div class="eyebrow">Bon à savoir</div><h3 class="serif" style="font-size:29px;margin:12px 0">Des bureaux d’état civil dans plusieurs quartiers.</h3><p>Le site actuel présente notamment des bureaux à Nyékonakpoé, Kodjoviakopé, Sangaratimé, Octaviano Nétimé, Tokoin Sylvanus Olympio, Bè-Klikamé et Amoutivé.</p><a href="#/demarches/bureaux" class="textlink">Consulter la liste ${icon('arrow')}</a></div></div></div></section>`}
const bureauNames=['Siège de la mairie — Nyékonakpoé','Kodjoviakopé','Nyékonakpoé','Sangaratimé','Octaviano Nétimé','Tokoin Sylvanus Olympio','Bè-Klikamé','Amoutivé'];
const details={naissance:{h:'Acte de naissance',intro:'Les principales informations pour déclarer une naissance et obtenir un acte d’état civil.',doc:['Attestation de naissance délivrée par l’établissement de santé, selon le cas.','Fiche de déclaration à compléter et informations sur l’enfant.','Autres pièces qui pourraient être demandées par le bureau compétent.'],body:'La naissance doit être déclarée au service de l’état civil compétent dans le délai légal applicable. Le site actuel indique une procédure de déclaration et d’établissement de l’acte.'},mariage:{h:'Mariage civil',intro:'Anticipez les formalités et rassemblez les documents nécessaires à la célébration d’un mariage civil.',doc:['Informations d’identité des futurs époux.','Pièces et justificatifs indiqués dans le dossier administratif de mariage.','Renseignement auprès de la mairie pour les formalités et les délais.'],body:'Le site municipal met à disposition une fiche relative aux formalités de mariage. Les pièces et délais doivent être confirmés selon la situation des futurs époux.'},deces:{h:'Acte de décès',intro:'Retrouvez les principales étapes relatives à la déclaration d’un décès.',doc:['Attestation de décès ou document médical correspondant, selon la situation.','Informations nécessaires à l’enregistrement du décès.','Pièces complémentaires à préciser avec le bureau compétent.'],body:'Le site actuel présente une procédure de déclaration de décès et les formalités d’enregistrement au registre d’état civil.'},extraits:{h:'Extraits & copies intégrales',intro:'Demandez une copie ou un extrait d’un acte conservé dans les registres d’état civil.',doc:['Références de l’acte demandé.','Copie de l’acte, si disponible.','Pièce d’identité ou justificatif applicable selon le type de demande.'],body:'Les extraits et copies intégrales reproduisent certaines ou toutes les informations enregistrées. La procédure et les frais dépendent de l’acte et du bureau compétent.'},certificats:{h:'Certificats & attestations',intro:'Informations sur les certificats de célibat, de coutume et diverses attestations.',doc:['Document d’état civil approprié à la demande.','Justificatifs requis selon la nature du certificat.','Dossier à confirmer auprès du service municipal.'],body:'La mairie présente plusieurs types de certificats et d’attestations. Le contenu et les conditions de délivrance varient selon le document sollicité.'},transcriptions:{h:'Transcription d’actes',intro:'Renseignements relatifs aux formalités de transcription et d’inscription dans les registres.',doc:['Copie de l’acte ou du jugement concerné.','Références de la décision ou du document initial.','Justificatifs complémentaires prévus selon le dossier.'],body:'Cette démarche peut concerner certains actes d’état civil et jugements supplétifs. Se renseigner auprès du service compétent.'},bureaux:{h:'Bureaux d’état civil',intro:'Retrouvez les bureaux d’état civil mentionnés dans les informations municipales.',doc:[],body:'Les prestations et les bureaux compétents varient selon le type de demande. Avant votre déplacement, confirmez l’adresse, les horaires et le service disponible.'},partenariat:{h:'Devenir partenaire',intro:'Ensemble, soutenir les initiatives et le développement de la commune.',doc:[],body:'Le site actuel présente une procédure de partenariat et un formulaire de contact pour les acteurs intéressés par une collaboration avec la commune.'},actes:{h:'Documents administratifs',intro:'Retrouvez les formulaires et publications accessibles depuis le site municipal.',doc:[],body:'Plusieurs fichiers PDF et formulaires sont disponibles dans les pages historiques du site. Leur mise à jour et leur classification seront vérifiées avant mise en ligne.'}};
function detail(slug){const d=details[slug];if(!d)return demarches();let extra=slug==='bureaux'?`<div class="detail-panel"><h2>Liste des bureaux mentionnés</h2><ul>${bureauNames.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';let doc=d.doc.length?`<div class="detail-panel"><h2>Pièces à prévoir</h2><ul>${d.doc.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';let pdf=slug==='mariage'?`<p><a class="textlink" target="_blank" rel="noopener noreferrer" href="${SOURCE.mariagepdf}">Consulter le dossier de mariage historique ${icon('up')}</a></p>`:'';return `${pagehero(d.h,d.intro,'Démarches / '+d.h)}<section class="section section-soft"><div class="wrap detail-layout"><div><div class="detail-panel"><div class="eyebrow">Votre démarche en pratique</div><h2>À savoir avant de commencer</h2><p>${d.body}</p>${pdf}<div class="notebox">Les conditions, pièces, délais et éventuels frais affichés sur le site historique doivent être confirmés par la mairie avant toute utilisation administrative.</div></div>${doc}${extra}<div class="detail-panel"><h2>Comment procéder ?</h2><div class="simple-steps" style="grid-template-columns:repeat(auto-fit,minmax(155px,1fr))"><div class="step"><div class="stepnum">01</div><h3>Se renseigner</h3><p>Vérifiez la procédure et le bureau compétent.</p></div><div class="step"><div class="stepnum">02</div><h3>Préparer</h3><p>Rassemblez les pièces nécessaires.</p></div><div class="step"><div class="stepnum">03</div><h3>Se présenter</h3><p>Adressez-vous au service concerné.</p></div></div></div><a href="#/demarches" class="textlink">← Retour à toutes les démarches</a></div><aside><div class="asidebox"><div class="eyebrow gold">Besoin d'une précision ?</div><h3>Votre mairie vous accompagne.</h3><p>Pour toute question sur les délais, les pièces à fournir ou les services compétents, contactez la mairie.</p><p style="font-weight:800;font-size:16px;color:white">+228 91 16 00 22</p>${btn('Prendre rendez-vous','#/rendez-vous','btn-gold','calendar')}</div></aside></div></section>`}
function actualites(){return `${pagehero('Actualités & communiqués','Restez informé des activités de la municipalité, des décisions et des initiatives publiées par la commune.','Actualités')}<section class="section"><div class="wrap"><div class="sectionhead"><div><div class="eyebrow">Vie municipale</div><h2 class="serif section-title">Les publications disponibles</h2><p class="intro">Sélection des dernières publications institutionnelles identifiées sur le site existant.</p></div><span class="ribbon">Archives 2024–2025</span></div><div class="newsgrid">${news.map(cardNews).join('')}</div><div class="notebox" style="margin-top:31px">Les publications présentées sont des archives du site actuel. Les actualités de la mandature en cours seront actualisées après validation éditoriale.</div></div></section><section class="section section-soft"><div class="wrap cta-line"><div><div class="eyebrow">Communiqués & décisions</div><h2 class="serif section-title">Une information publique accessible.</h2></div>${btn('Découvrir nos services','#/demarches')}</div></section>`}
function projets(){return `${pagehero('Projets & développement','Les ambitions locales pour améliorer le cadre de vie, la solidarité et la qualité des services publics.','Projets & développement',true)}<section class="section"><div class="wrap"><div class="eyebrow">Développement territorial</div><h2 class="serif section-title">Des priorités pour le quotidien des habitants.</h2><p class="intro" style="margin-bottom:32px">La mission municipale couvre plusieurs domaines structurants. Ces thématiques présentent les champs d’action de la commune, et non une liste de projets officiellement annoncés.</p><div class="projectgrid">${[{ic:'building',h:'Aménagement & cadre de vie',p:'Organisation du territoire, équipements de proximité et amélioration de l’environnement urbain.'},{ic:'heart',h:'Cohésion & solidarité',p:'Initiatives sociales, accompagnement communautaire et accès aux services essentiels.'},{ic:'leaf',h:'Environnement & durabilité',p:'Développement durable, salubrité et amélioration du cadre de vie.'},{ic:'book',h:'Éducation & culture',p:'Valorisation des initiatives éducatives, culturelles et de la vie associative.'},{ic:'users',h:'Citoyenneté & participation',p:'Concertation locale, écoute et implication des habitants.'},{ic:'briefcase',h:'Développement économique',p:'Dynamisme des activités locales et collaboration avec les partenaires.'}].map(x=>`<article class="projectcard">${icon(x.ic)}<h3>${x.h}</h3><p>${x.p}</p></article>`).join('')}</div></div></section><section class="section section-soft"><div class="wrap cols-2 aligned"><div><div class="eyebrow">Planification</div><h2 class="serif section-title">Le Plan de Développement Communal.</h2><p class="intro">Document structurant pour les objectifs, les actions et le suivi de l’action publique locale. Sa publication complète nécessite le document validé par la municipalité.</p><a class="textlink" href="#/projets/pdc">Découvrir le plan de développement ${icon('arrow')}</a></div><div class="callout"><div class="eyebrow">Gouvernance & transparence</div><h3 class="serif" style="font-size:29px">Des documents utiles, au même endroit.</h3><p>La future plateforme pourra regrouper les rapports, documents publics, programmes et informations sur les projets au fur et à mesure de leur publication officielle.</p></div></div></section><section class="section"><div class="wrap"><div class="eyebrow">Pour aller plus loin</div><h2 class="serif section-title">Explorer les actions de développement.</h2>${v3Grid([v3Card('Le PDC','Document de référence de planification.','projets/pdc','file'),v3Card('Axes d’intervention','Les principaux champs d’action municipale.','projets/axes','leaf'),v3Card('Partenariats','Les modalités de collaboration.','projets/partenariats','users')])}</div></section>`}
function contact(){return `${pagehero('Contacter la mairie','Les informations pratiques pour joindre les services municipaux et préparer votre venue.','Contact')}<section class="section"><div class="wrap contact-grid"><div><div class="eyebrow">Nous joindre</div><h2 class="serif section-title">À votre écoute.</h2><p class="intro">Pour toute question concernant les démarches et les services de la commune, contactez la mairie d’Amoutivé.</p><div class="contactdetails"><div class="contactitem">${icon('pin')}<div><b>Adresse</b><p>Nyékonakpoé, rue Nyala, bâtiment n° 3, face UTB circulaire, Lomé, Togo.</p></div></div><div class="contactitem">${icon('phone')}<div><b>Téléphone</b><p><a href="tel:+22891160022">+228 91 16 00 22</a></p></div></div><div class="contactitem">${icon('clock')}<div><b>Horaires</b><p>Renseignez-vous auprès de la mairie pour les horaires d’ouverture des services.</p></div></div></div>${btn('Rechercher la mairie sur Maps','https://www.google.com/maps/search/?api=1&query=Mairie+Amoutive+Lome','btn-outline','up')}</div><div class="formcard"><h2>Envoyer une demande</h2><p class="muted" style="font-size:12px">Renseignez le formulaire ci-dessous.</p><form id="contactForm"><div class="formgrid"><div class="field"><label for="name">Nom complet *</label><input id="name" name="name" required placeholder="Votre nom"></div><div class="field"><label for="tel">Téléphone</label><input id="tel" name="tel" type="tel" placeholder="Votre numéro"></div><div class="field full"><label for="email">Adresse e-mail *</label><input id="email" type="email" name="email" required placeholder="votre@email.com"></div><div class="field full"><label for="object">Objet *</label><select id="object" required name="object"><option value="">Choisissez un motif</option><option>Démarche administrative</option><option>Informations sur la municipalité</option><option>Autre demande</option></select></div><div class="field full"><label for="msg">Votre message *</label><textarea id="msg" name="message" required placeholder="Décrivez votre demande..."></textarea></div></div><p class="formtip">* Champs obligatoires</p><button class="btn btn-primary" type="submit">Envoyer ma demande ${icon('send')}</button><div role="status" id="contactStatus" class="formstatus"></div></form></div></div></section>`}
function rdv(){return `${pagehero('Prendre rendez-vous','Préparez votre demande de rencontre avec un service de la mairie d’Amoutivé.','Rendez-vous')}<section class="section"><div class="wrap contact-grid"><div><div class="eyebrow">Une démarche simple</div><h2 class="serif section-title">Organiser votre visite.</h2><p class="intro">Le site municipal actuel dispose déjà d’un formulaire de rendez-vous. Le nouvel espace vise à rendre les informations plus claires et le parcours plus rapide.</p><div class="simple-steps" style="grid-template-columns:1fr;margin-top:29px"><div class="step"><div class="stepnum">01</div><h3>Précisez votre demande</h3><p>Indiquez le service concerné et l’objet de la rencontre.</p></div><div class="step"><div class="stepnum">02</div><h3>Choisissez une date indicative</h3><p>La date sera à confirmer selon les disponibilités du service.</p></div><div class="step"><div class="stepnum">03</div><h3>Attendez la confirmation</h3><p>La prise de rendez-vous effective sera activée lors de la mise en production.</p></div></div><p class="muted" style="font-size:11px;margin-top:23px">Pour une demande réelle maintenant : <a href="${SOURCE.rdv}" target="_blank" rel="noopener noreferrer" class="textlink">accéder au formulaire actuel ${icon('up')}</a></p></div><div class="formcard"><h2>Demander un rendez-vous</h2><p class="muted" style="font-size:12px">Formulaire de démonstration de l’interface.</p><form id="rdvForm"><div class="formgrid"><div class="field"><label for="rn">Nom et prénom *</label><input required id="rn" placeholder="Votre nom"></div><div class="field"><label for="rp">Téléphone *</label><input required id="rp" type="tel" placeholder="Votre numéro"></div><div class="field full"><label for="re">Adresse e-mail *</label><input required id="re" type="email" placeholder="votre@email.com"></div><div class="field full"><label for="rs">Service souhaité *</label><select required id="rs"><option value="">Choisir un service</option><option>État civil</optio function v4Actualites(){const rows=news.map((n,i)=>{let id=['session-2025','budget-2025','pieces-identite-2024'][i];return `<a class="v4-news-row" href="#/actualites/article/${id}"><span class="v4-news-date">${n.date}</span><span class="v4-news-copy"><small>${n.tag} · Archive</small><strong>${n.t}</strong><em>${n.desc}</em></span><span class="v4-news-arrow">${icon('arrow')}</span></a>`}).join('');return `${pagehero('Actualités & publications','Retrouvez les annonces, les archives de la vie municipale et les communiqués officiels.','Actualités',true)}<section class="section"><div class="wrap v4-news-page"><div class="v4-news-heading">${v4MediaLabel('Le fil municipal')}<h2 class="serif">La vie de notre commune.</h2><p>Les contenus ci-dessous sont des archives sélectionnées du site existant. Les nouvelles publications seront validées par la cellule de communication.</p></div><div class="v4-news-spotlight"><div class="v4-news-spotlight-art"><span>ARCHIVES</span><strong>GOLFE <i>04</i></strong></div><div><small>À LA UNE · 11 JUILLET 2025</small><h3>${news[0].t}</h3><p>${news[0].desc}</p><a class="btn btn-primary" href="#/actualites/article/session-2025">Lire la publication ${icon('arrow')}</a></div></div><div class="v4-news-heading smaller"><h2 class="serif">Toutes les archives sélectionnées</h2><a href="#/actualites/communiques" class="textlink">Communiqués officiels ${icon('arrow')}</a></div><div class="v4-news-list">${rows}</div></div></section>`}

function v4Decorate(){
 let hash=decodeURIComponent(location.hash.replace(/^#\/?/,'')).replace(/\/+$/,'');
 document.body.classList.toggle('v4-home',!hash);
 const main=document.querySelector('main');if(!main)return;
 // Navigation transversale dans les pages secondaires et guide de démarches.
 if(!hash){const target=main.querySelector('.quick-wrap');if(target)target.insertAdjacentHTML('afterend',`<div class="wrap v4-home-guide"><div>${v4MediaLabel('Accès rapide')}<strong>Vous avez une démarche à effectuer ?</strong><p>Identifiez le bon service en quelques clics.</p></div><a class="btn btn-primary" href="#/demarches/guide">Trouver ma démarche ${icon('arrow')}</a></div>`)}
 if(hash==='demarches'){
  const panel=main.querySelector('.directorytools');if(panel)panel.insertAdjacentHTML('beforebegin',`<div class="v4-catalog-head"><span>${v4MediaLabel('Guichet citoyen')}<h2 class="serif">Tous les services, en un seul endroit.</h2></span><a class="btn btn-primary" href="#/demarches/guide">Être orienté ${icon('arrow')}</a></div>`);
 }
 if(hash==='espace-citoyen'){
  const list=main.querySelector('.v3-grid');if(list)list.insertAdjacentHTML('beforeend',v3Card('Numéros utiles','Retrouvez les contacts et l’orientation en cas de besoin.','espace-citoyen/urgences','phone'));
 }
 if(hash==='commune'){
  const cards=main.querySelector('.v3-grid, .cardsgrid'); if(cards)cards.insertAdjacentHTML('beforeend',v3Card('Les quartiers','Découvrir les quartiers référencés par la commune.','commune/quartiers','pin'));
 }
 const nav=document.querySelector('.desktopnav');if(nav&&!nav.querySelector('[href="#/demarches/guide"]')){
  const a=document.createElement('a');a.href='#/demarches/guide';a.className='v4-nav-helper';a.textContent='Trouver ma démarche';nav.appendChild(a);
 }
 const search=document.getElementById('v4DistrictSearch');if(search){const run=()=>{let needle=search.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let shown=0;document.querySelectorAll('#v4DistrictList .v4-quarter').forEach(el=>{let s=el.dataset.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'');let yes=s.includes(needle);el.hidden=!yes;if(yes)shown++});document.getElementById('v4DistrictCount').textContent=`${shown} quartier${shown>1?'s':''} correspondant${shown>1?'s':''}`};search.addEventListener('input',run)}
 const guide=document.getElementById('v4GoGuide');if(guide)guide.addEventListener('click',()=>{const selected=document.querySelector('input[name="v4Need"]:checked');let s=v4Guides.find(i=>i.slug===selected?.value)||v4Guides[0];let path=s.slug==='rdv'?'rendez-vous':s.slug==='suggestions'?'participer':'demarches/'+s.slug;let status=document.getElementById('v4GuideResponse');status.innerHTML=`Orientation trouvée : <a href="#/${path}">${s.t} ${icon('arrow')}</a>`;status.classList.add('show');location.hash='#/'+path});
 document.querySelectorAll('.v3-aside nav a').forEach(a=>{let id=a.getAttribute('href')?.replace(/^#\//,'');a.classList.toggle('here',id===hash)});
 // Liens principaux accessibles au clavier et disposition harmonisée.
 document.querySelectorAll('a,button,input,select,textarea').forEach(el=>{if(!el.hasAttribute('tabindex'))el.setAttribute('tabindex','0')});
 const current=main.querySelector('h1')?.textContent?.trim()||'Accueil';document.title=`${current} · Commune du Golfe 4`;
}
